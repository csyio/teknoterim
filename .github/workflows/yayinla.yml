name: Yayınla

# Derleme CI'da yapılır (sunucuda değil): VPS'te 2 GB RAM var ve orada iki
# canlı proje çalışıyor. Ayrıca derleme çıktısı sunucunun mimarisiyle (linux x64)
# ve Node sürümüyle uyumlu olmak zorunda — bu yüzden runner'ı da 22'ye sabitledik.
#
# Derleme her zaman çalışır (push eden her değişiklik doğrulanır). Dağıtım
# adımları ise yalnızca SSH sırları tanımlıysa çalışır; aksi hâlde uyarı verip
# atlanır. Sırların kurulumu: infra/README.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  derle-ve-yayinla:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Kod denetimi
        run: npm run lint

      - name: Testler
        run: npm test

      - name: Derle
        run: npm run build

      # standalone çıktısı public/ ve .next/static'i kendiliğinden içermez.
      # araclar/ da kopyalanır: sunucuda TypeScript kaynağı yok, ölçüm raporu
      # bu yüzden kendi kendine yeten bir dosya olarak taşınır.
      - name: Çıktıyı tamamla
        run: |
          cp -r public .next/standalone/public
          cp -r araclar .next/standalone/araclar
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: Dağıtım sırları tanımlı mı?
        id: kontrol
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "${{ secrets.SSH_SUNUCU }}" ]; then
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH sırları tanımlı değil ya da bu bir pull request. Dağıtım atlandı — bkz. infra/README.md"
          else
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH anahtarını hazırla
        if: steps.kontrol.outputs.hazir == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_ANAHTAR }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_SUNUCU }}" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete kullanılıyor ama veri ve sır dosyaları korunuyor.
      - name: Sunucuya kopyala
        if: steps.kontrol.outputs.hazir == 'true'
        run: |
          rsync -az --delete \
            --exclude '.env*' \
            --exclude 'data/' \
            --exclude '*.db' --exclude '*.db-wal' --exclude '*.db-shm' \
            --exclude '.git' \
            .next/standalone/ \
            "${{ secrets.SSH_KULLANICI }}@${{ secrets.SSH_SUNUCU }}:/opt/teknoterim/"

      - name: Servisi yeniden başlat
        if: steps.kontrol.outputs.hazir == 'true'
        run: |
          ssh "${{ secrets.SSH_KULLANICI }}@${{ secrets.SSH_SUNUCU }}" \
            'sudo systemctl restart teknoterim.service'
